{% extends "base.html" %}
{% block title %}Delete note — ULAB StudyConnect{% endblock %}
{% block content %}
<div class="notes-hub-page reveal">
  <nav class="breadcrumb breadcrumb-premium" aria-label="Breadcrumb">
    <a href="{% url 'notes:note_list' %}">My notes</a>
    <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
    <span class="breadcrumb-current">Delete</span>
  </nav>
  <div class="confirm-card">
    <div class="confirm-icon"><i class="fa-solid fa-note-sticky"></i></div>
    <h1>Delete this note?</h1>
    <p>{{ note.title }} will be removed from your notebook.</p>
    <form method="post" data-confirm="Delete this note?" class="confirm-actions">
      {% csrf_token %}
      <a href="{% url 'notes:note_list' %}" class="btn-ghost">Cancel</a>
      <button type="submit" class="btn-danger">Delete note</button>
    </form>
  </div>
</div>
{% endblock %}
