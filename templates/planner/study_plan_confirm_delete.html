{% extends "base.html" %}
{% block title %}Delete plan — ULAB StudyConnect{% endblock %}
{% block content %}
<div class="planner-page reveal">
  <nav class="breadcrumb breadcrumb-premium" aria-label="Breadcrumb">
    <a href="{% url 'planner:study_plan_list' %}">Saved plans</a>
    <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
    <span class="breadcrumb-current">Delete</span>
  </nav>
  <div class="confirm-card">
    <div class="confirm-icon"><i class="fa-solid fa-calendar-xmark"></i></div>
    <h1>Delete this study plan?</h1>
    <p>Finals Prep will be removed from your saved plans. This demo does not change any backend data.</p>
    <form method="post" data-confirm="Delete this study plan?" class="confirm-actions">
      {% csrf_token %}
      <a href="{% url 'planner:study_plan_list' %}" class="btn-ghost">Cancel</a>
      <button type="submit" class="btn-danger">Delete plan</button>
    </form>
  </div>
</div>
{% endblock %}
