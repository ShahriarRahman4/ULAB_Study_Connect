{% extends "base.html" %}
{% block title %}Delete saved routine — ULAB StudyConnect{% endblock %}
{% block content %}
<div class="routine-page reveal">
  <nav class="breadcrumb breadcrumb-premium" aria-label="Breadcrumb">
    <a href="{% url 'routines:saved_routine_list' %}">Saved routines</a>
    <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
    <span class="breadcrumb-current">Delete</span>
  </nav>
  <div class="confirm-card">
    <div class="confirm-icon"><i class="fa-solid fa-bookmark"></i></div>
    <h1>Remove this saved routine?</h1>
    <p><strong>{{ saved.name }}</strong> will leave your saved list. Official exam data is not deleted.</p>
    <form method="post" data-confirm="Remove this saved routine?" class="confirm-actions">
      {% csrf_token %}
      <a href="{% url 'routines:saved_routine_list' %}" class="btn-ghost">Cancel</a>
      <button type="submit" class="btn-danger">Remove saved routine</button>
    </form>
  </div>
</div>
{% endblock %}
