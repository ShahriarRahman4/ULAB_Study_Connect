{% extends "base.html" %}
{% block title %}Save routine — ULAB StudyConnect{% endblock %}
{% block content %}
<div class="routine-page">
  <h1 class="resources-hero-title">Save a personal routine</h1>
  <form method="post" class="pdf-upload-form" style="margin-top:1.5rem;">
    {% csrf_token %}
    <div class="pdf-field">
      <label class="label-premium" for="name">Name</label>
      <input id="name" name="name" class="input-premium no-icon" value="{{ initial_name }}" required>
    </div>
    <div class="pdf-field">
      {% for exam in exams %}
      <label class="about-value-card" style="display:flex;gap:12px;align-items:flex-start;margin-bottom:8px;">
        <input type="checkbox" name="exam_ids[]" value="{{ exam.pk }}" {% if exam.pk in selected_exam_ids %}checked{% endif %}>
        <span><strong>{{ exam.course_code }}</strong> Sec {{ exam.section }} — {{ exam.exam_date }} {{ exam.exam_time }}</span>
      </label>
      {% empty %}
      <p>No exams to save.</p>
      {% endfor %}
    </div>
    <button type="submit" class="btn-primary">Save routine</button>
  </form>
</div>
{% endblock %}
