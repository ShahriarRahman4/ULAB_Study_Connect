{% extends "base.html" %}
{% block title %}Delete routine — ULAB StudyConnect{% endblock %}
{% block content %}
<div class="routine-page reveal">
  <nav class="breadcrumb breadcrumb-premium" aria-label="Breadcrumb">
    <a href="{% url 'routines:routine_list' %}">Routines</a>
    <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
    <span class="breadcrumb-current">Delete</span>
  </nav>
  <div class="confirm-card">
    <div class="confirm-icon"><i class="fa-solid fa-trash"></i></div>
    <h1>Delete this routine listing?</h1>
    <p>This is a frontend preview. Confirming returns you to the exam list — no data is changed.</p>
    <form method="post" data-confirm="Delete this routine listing?" class="confirm-actions">
      {% csrf_token %}
      <a href="{% url 'routines:routine_list' %}" class="btn-ghost">Cancel</a>
      <button type="submit" class="btn-danger">Delete listing</button>
    </form>
  </div>
</div>
{% endblock %}
