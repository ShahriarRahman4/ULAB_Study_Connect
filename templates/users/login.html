{% extends 'base.html' %}

{% block title %}Login - ULAB StudyConnect{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Welcome Back</h2>
        <p class="muted mb-3" style="text-align:center;">Login to ULAB StudyConnect</p>

        <form method="post">
            {% csrf_token %}
            {% if form.errors %}
                <div class="alert alert-error">
                    Invalid username or password. Please try again.
                </div>
            {% endif %}

            <div class="form-group">
                <label class="form-label" for="id_username">Username</label>
                <input type="text" name="username" id="id_username" class="input" autofocus autocomplete="username" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="id_password">Password</label>
                <input type="password" name="password" id="id_password" class="input" autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%;">Login</button>
        </form>

        <div class="divider"></div>

        <p style="text-align:center;" class="muted">
            Don't have an account? <a href="{% url 'users:register' %}">Sign up here</a>
        </p>
    </div>
</div>
{% endblock %}
